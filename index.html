<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>hello-eks</title>
  <style>
    :root { --bg: #f4f7f5; --fg: #14201a; --muted: #5c6b63; --ok: #1a9e55; --card: #ffffff; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0e1512; --fg: #e8f1ec; --muted: #8fa398; --ok: #34d17a; --card: #16201b; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: var(--bg); color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .card {
      background: var(--card); border-radius: 20px; padding: 48px 56px;
      text-align: center; box-shadow: 0 8px 32px rgba(0,0,0,.12);
    }
    .check { width: 96px; height: 96px; margin: 0 auto 24px; }
    .check circle { fill: var(--ok); }
    .check path {
      fill: none; stroke: #fff; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round;
      stroke-dasharray: 60; stroke-dashoffset: 60; animation: draw .6s .2s ease forwards;
    }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    h1 { margin: 0 0 8px; font-size: 2.4rem; letter-spacing: -0.5px; }
    p { margin: 0; color: var(--muted); }
  </style>
</head>
<body>
  <main class="card">
    <svg class="check" viewBox="0 0 96 96" role="img" aria-label="Acesso bem-sucedido">
      <circle cx="48" cy="48" r="46"/>
      <path d="M26 50 L41 65 L70 33"/>
    </svg>
    <h1>hello-eks</h1>
    <p>Acesso bem-sucedido ✔ — rodando no Amazon EKS atrás de um Ingress (ALB)</p>
  </main>
</body>
</html>
